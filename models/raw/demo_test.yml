version: 2

models: 
  - name: raw_customers
    columns: 
      - name: customerid
        tests:
          - unique
          - not_null
  - name: raw_orders
    columns:
      - name: orderid
        tests:
          - not_null
      - name: customerid
        tests:
          - relationships:
              arguments:
                to: ref('raw_customers')
                field: customerid
      - name: shipmode
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'First Class'
                  - 'Same Day'
                  - 'Second Class'
                  - 'Standard Class'
                  - 'Unknown'
                 

      
          